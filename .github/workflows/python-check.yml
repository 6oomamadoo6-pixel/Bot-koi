name: Python syntax and dependency check

on:
  pull_request:
  push:
    branches:
      - main
      - perf/golden-chat-latency
      - turso-migration
      - fix/admin-users-miniapp

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile main.py admin_panel.py mini_app.py turso_db.py
